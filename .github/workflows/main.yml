name: .NET CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./CyberSecurityChatbot/CyberSecurityChatbot.csproj

    - name: Build
      run: dotnet build ./CyberSecurityChatbot/CyberSecurityChatbot.csproj --no-restore --configuration Release

    - name: Test
      run: echo "No tests yet"
